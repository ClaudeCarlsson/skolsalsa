services:
  explorer:
    build:
      context: ..
      target: explorer
    restart: unless-stopped
    networks:
      - skolsalsa
    expose:
      - "3000"
    volumes:
      - ../data/salsa.db:/app/data/salsa.db:ro
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/salsa.db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    networks:
      - skolsalsa
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      explorer:
        condition: service_healthy

networks:
  skolsalsa:
    name: skolsalsa

volumes:
  caddy_data:
  caddy_config:
